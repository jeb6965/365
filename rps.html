<!DOCTYPE html>
<!--Jordan Boykin-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
		"use strict";
        alert("Let's play rock, paper, scissors. The best 2 out of 3 wins!");
        const choice = ["r", "p", "s"];
        let winner;
        let playerChoice;
        let computerChoice;
        let playerScore = 0; 
        let computerScore = 0;
        while(playerScore < 2 && computerScore < 2){
            playerChoice = prompt('What is your choice? Enter "r" for rock, "p" for paper, or "s" for scissors.');
            playerChoice = playerChoice.toLowerCase()
            while(!choice.includes(playerChoice)){
                playerChoice = prompt('What is your choice? Enter "r" for rock, "p" for paper, or "s" for scissors.');
                playerChoice = playerChoice.toLowerCase();
            }
            computerChoice = choice[Math.floor(Math.random() * 3)];
            if (playerChoice === computerChoice){
                winner = "It's a tie.";
            }
            else{
                if ((playerChoice == "r" && computerChoice == "p") || 
                    (playerChoice == "p" && computerChoice == "s") || 
                    (playerChoice == "s" && computerChoice == "r")){
                    computerScore ++
                    winner = "Computer wins.";
                }
                else{ 
                    playerScore++
                    winner = "Player wins.";
                }
            };
                alert(`${winner} Computer chose ${computerChoice} and player chose ${playerChoice}. Score is computer: ${computerScore}, player: ${playerScore}`);
        };
        alert(`Game over. Final score is Computer: ${computerScore}, Player: ${playerScore}`);
    </script>
	<h1>Thanks for playing!</h1>
	<h2>Refresh to play again</h2>
</body>
</html>
