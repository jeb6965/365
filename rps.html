<!DOCTYPE html>
<!--Jordan Boykin-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <script>
		"use strict";
        alert("Let's play rock, paper, scissors. The best 2 out of 3 wins!");
        const choice = ["r", "p", "s"];
        let playerChoice;
        let computerChoice;
        let randomNum;
        let playerScore = 0;
        let computerScore = 0;
        while(playerScore < 2 && computerScore < 2){
            playerChoice = prompt('What is your choice? Enter "r" for rock, "p" for paper, or "s" for scissors.');
            playerChoice = playerChoice.toLowerCase()
            while(!choice.includes(playerChoice)){
                playerChoice = prompt('What is your choice? Enter "r" for rock, "p" for paper, or "s" for scissors.');
                playerChoice = playerChoice.toLowerCase();
            }
            randomNum = Math.floor(Math.random() * 3);
            switch(randomNum){
                case 0:
                    if(playerChoice === "r"){alert("Tie!");}
                    else if(playerChoice === "p"){alert("Player Wins!");}
                    else alert("Computer Wins!");
                    break;
                case 1:
                    if(playerChoice === "p"){alert("Tie!");}
                    else if(playerChoice === "s"){alert("Player Wins!");}
                    else alert("Computer Wins!");
                    break;
                case 2:
                    if(playerChoice === "s"){alert("Tie!");}
                    else if(playerChoice === "r"){alert("Player Wins!");}
                    else alert("Computer Wins!");
                    break;    
            }
        };
    </script>
	<h1>Thanks for playing!</h1>
	<h2>Refresh to play again</h2>
</body>
</html>
